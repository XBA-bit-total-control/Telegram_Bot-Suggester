services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # Existing MinIO service/volume retained; the console is bound to localhost only.
  minio:
    image: cleanstart/minio
    container_name: bot-suggester-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env.production}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.production}
      MINIO_SECURE: "false"
      FRONTEND_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
      REDIS_URL: redis://redis:6379/1
    command: ["uv", "run", "--no-sync", "uvicorn", "main:app", "--app-dir", "/app/src", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bot-suggester-proxy"
      - "traefik.http.routers.frontend.rule=Host(`${PUBLIC_DOMAIN}`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["uv", "run", "--no-sync", "python", "-m", "bot_suggester.run"]
    environment:
      BOT_MODE: webhook
      BOT_WEBHOOK_URL: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}${BOT_WEBHOOK_PATH:-/telegram/webhook}
      BOT_WEBHOOK_PATH: ${BOT_WEBHOOK_PATH:-/telegram/webhook}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:?Set BOT_WEBHOOK_SECRET in .env.production}
      BOT_WEBHOOK_HOST: 0.0.0.0
      BOT_WEBHOOK_PORT: "8080"
      REDIS_URL: redis://redis:6379/0
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bot-suggester-proxy"
      - "traefik.http.routers.bot-webhook.rule=Host(`${PUBLIC_DOMAIN}`) && PathPrefix(`${BOT_WEBHOOK_PATH:-/telegram/webhook}`)"
      - "traefik.http.routers.bot-webhook.priority=100"
      - "traefik.http.routers.bot-webhook.entrypoints=websecure"
      - "traefik.http.routers.bot-webhook.tls.certresolver=letsencrypt"
      - "traefik.http.services.bot-webhook.loadbalancer.server.port=8080"

  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=bot-suggester-proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?Set LETSENCRYPT_EMAIL in .env.production}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - proxy

networks:
  internal:
    internal: true
  proxy:
    name: bot-suggester-proxy

volumes:
  # Explicit name preserves the volume created by the previously shared MinIO compose setup.
  minio_data:
    name: bot_suggester_minio_data
  postgres_data:
  redis_data:
  traefik_certs:
