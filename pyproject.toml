[project]
name = "bot-suggester"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vladislav Huc", email = "vladislavhucisvili@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.5",
    "aiohttp-socks>=0.12.0",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.156.8",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "python-dotenv>=1.2.4",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
bot-suggester = "bot_suggester:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
